<!--
  discovery — sketch kit.

  Copy-paste parts for the sketched variants that go inside assets/variants-template.html.
  Two families:
    · WIREFRAME parts — apps, websites, desktop software
    · STORYBOARD parts — games (what happens in a moment of play)

  RULES (the whole point of sketching)
  - Rough on purpose. Never tidy these up.
  - No real copy. Body text is squiggle lines. Only structural words get real letters,
    and only where the sketch is meaningless without them.
  - Greyscale plus ONE accent, used sparingly to mark the one thing that matters in
    this variant (the selected item, the thing that moves, the player).
  - Colours come only from: var(--ink) strokes, var(--paper) fills, var(--accent),
    var(--border). Those are defined in variants-template.html. No hex, ever.
  - Every sketch sits in a viewBox 320 wide. Height varies; keep it under ~230 so three
    cards fit on one screen.

  THE ROUGH LOOK
  Draw clean geometry, then bend it with the feTurbulence + feDisplacementMap filters
  (`rough-a`, `rough-b`, `rough-c`) that variants-template.html defines once per page.
  Alternate the three seeds between adjacent groups so repeated shapes don't wobble in
  lockstep. Text must stay OUTSIDE a filtered group or it turns to mush.

    <g filter="url(#rough-a)" fill="none" stroke="var(--ink)" stroke-width="1.6"
       stroke-linecap="round"> ... shapes ... </g>

  Stroke widths: 1.6 for frames and structure, 1.5 for content boxes, 1.4 for minor
  furniture, 4 for accent bars. Squiggle body text is 1.5 at opacity .55.

  THE ONE TRAP
  Those filters declare filterUnits="userSpaceOnUse" and you must not "simplify" that
  away. With the SVG default (objectBoundingBox) a group containing only a horizontal
  or vertical line has a zero-height bounding box, its filter region collapses, and the
  group renders as nothing at all — no error, no warning, just a missing shape. It
  eats single accent bars specifically, which is the mark you least want to lose.
  If a group ever disappears, this is why: give it a second shape at a different y, or
  check the filter still says userSpaceOnUse. Any sketch wider than 320 or taller than
  260 units needs the filter region widened to match.
-->

<!-- =========================================================== STORYBOARD PARTS -->
<!--
  A storyboard variant is a STRIP of 3 panels reading left to right: what the player
  sees, then what they do, then what happens. Three panels of 96 wide at x 12 / 114 /
  216, y 24..150, with a caption line under each. That is one variant; the variants
  differ in how the moment plays out, not in how it is drawn.
-->

<!-- PANEL FRAMES + captions. Captions are the ONE place real words are allowed in a
     storyboard, because a panel without its beat label is unreadable. Put the <text>
     outside the filtered group. -->
<g filter="url(#rough-a)" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round">
  <rect x="12" y="24" width="96" height="104" rx="4"/>
  <rect x="114" y="24" width="96" height="104" rx="4"/>
  <rect x="216" y="24" width="96" height="104" rx="4"/>
</g>
<text x="60" y="146" text-anchor="middle" class="beat">{{sees the door}}</text>
<text x="162" y="146" text-anchor="middle" class="beat">{{spends a light}}</text>
<text x="264" y="146" text-anchor="middle" class="beat">{{room opens}}</text>

<!-- ENVIRONMENT — horizon plus a couple of forms. Keeps a panel from reading as empty
     without drawing anything anyone could argue about. Forms sit at x 58..98, leaving
     x 12..52 clear for the player and their motion lines; if you move the player,
     move these too rather than letting them overlap. -->
<g filter="url(#rough-b)" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round" opacity=".55">
  <path d="M12 96 h96"/>
  <path d="M58 96 v-16 h14 v16"/>
  <path d="M78 96 v-24 l10 -8 10 8 v24"/>
</g>

<!-- PLAYER — a blob with a head, not a stick figure: reads as "a character" without
     implying an art style. Accent marks it as the thing the player controls. -->
<g filter="url(#rough-c)" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round">
  <circle cx="46" cy="80" r="6"/>
  <path d="M46 86 q-7 8 -6 18 h12 q1 -10 -6 -18"/>
</g>

<!-- MOTION / INPUT — speed lines behind a moving thing, and a button-press burst.
     These carry the verb of the panel, so they always use the accent. -->
<g filter="url(#rough-a)" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" opacity=".8">
  <path d="M30 76 h-10 M28 82 h-13 M30 88 h-9"/>
</g>
<g filter="url(#rough-b)" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round">
  <path d="M162 60 v-9 M172 64 l7 -6 M152 64 l-7 -6 M162 78 v6"/>
</g>

<!-- CAMERA MOVE — a bracket pair plus an arrow, for "the view pushes in / pans right".
     Camera language is worth sketching because it is otherwise argued about in words. -->
<g filter="url(#rough-c)" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" opacity=".7">
  <path d="M228 40 h10 M228 40 v10"/>
  <path d="M300 40 h-10 M300 40 v10"/>
  <path d="M228 116 h10 M228 116 v-10"/>
  <path d="M300 116 h-10 M300 116 v-10"/>
</g>
<g filter="url(#rough-a)" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M244 78 h34"/>
  <path d="M278 78 l-7 -4"/><path d="M278 78 l-7 4"/>
</g>

<!-- HUD — a resource bar and a counter, for panels where the cost of the action is
     the point. Bar: track then fill; the fill length is the number in the caption. -->
<g filter="url(#rough-b)" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round" opacity=".6">

</g>

</g>
